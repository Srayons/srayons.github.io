<!DOCTYPE html>
<html>
<head>
    <title>Srayons 的聊天室</title>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #chat-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        #chat-header {
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        #username-section {
            margin-bottom: 20px;
        }
        #message-section {
            margin-top: 20px;
        }
        #message-form {
            display: flex;
            margin-bottom: 10px;
        }
        #message-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #send-button {
            margin-left: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-button:disabled {
            background-color: #cccccc;
        }
        #messages {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 3px;
        }
        .chat-message {
            background-color: #e3f2fd;
        }
        .join-message {
            background-color: #e8f5e8;
            color: green;
            text-align: center;
        }
        .leave-message {
            background-color: #ffebee;
            color: red;
            text-align: center;
        }
        .error-message {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .connected {
            color: green;
        }
        .disconnected {
            color: red;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">
            <h2>AI Srayons 聊天室</h2>
            <p>状态: <span id="connection-status" class="disconnected">未连接</span></p>
        </div>
        
        <div id="username-section">
            <input type="text" id="username-input" placeholder="输入您的用户名" />
            <button id="connect-button" onclick="connect()">连接</button>
            <button id="disconnect-button" onclick="disconnect()" disabled>断开连接</button>
        </div>
        
        <div id="message-section">
            <div id="messages"></div>
            
            <form id="message-form">
                <input type="text" id="message-input" placeholder="输入消息..." disabled />
                <button id="send-button" type="submit" disabled>发送</button>
            </form>
        </div>
    </div>

    <!-- 引入SockJS和STOMP客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <script>
        var stompClient = null;
        var connected = false;

        // 发送连接
        function setConnected(connected) {
            document.getElementById('connect-button').disabled = connected;
            document.getElementById('disconnect-button').disabled = !connected;
            document.getElementById('username-input').disabled = connected;
            document.getElementById('message-input').disabled = !connected;
            document.getElementById('send-button').disabled = !connected;
            
            // 检测连接状态
            if (connected) {
                document.getElementById('connection-status').textContent = '已连接';
                document.getElementById('connection-status').className = 'connected';
            } else {
                document.getElementById('connection-status').textContent = '未连接';
                document.getElementById('connection-status').className = 'disconnected';
            }
        }

        function connect() {
            var username = document.getElementById('username-input').value.trim();
            
            if (username === '') {
                alert('请输入用户名');
                return;
            }
            
            var socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function(frame) {
                console.log('Connected: ' + frame);
                connected = true;
                setConnected(true);
                
                // 发送注册消息
                stompClient.send("/app/chat.register", {}, JSON.stringify({
                    'from': username,
                    'type': 'JOIN'
                }));
                
                // 订阅公共聊天主题
                stompClient.subscribe('/topic/public', function(messageOutput) {
                    showMessage(JSON.parse(messageOutput.body));
                });
            });
        }

        // 断开连接
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            connected = false;
            setConnected(false);
            console.log("Disconnected");
        }

        function sendMessage() {
            var messageInput = document.getElementById('message-input');
            var message = messageInput.value.trim();
            
            if (message === '') {
                return;
            }
            
            var username = document.getElementById('username-input').value.trim();
            
            stompClient.send("/app/chat.send", {}, JSON.stringify({
                'from': username,
                'text': message,
                'type': 'CHAT'
            }));
            
            messageInput.value = '';
        }

        // 显示消息
        function showMessage(message) {
            var messagesDiv = document.getElementById('messages');
            var messageElement = document.createElement('div');
            
            var className = 'message ';
            var text = '';
            // 状态：加入、离开、聊天
            switch(message.type) {
                case 'JOIN':
                    className += 'join-message';
                    text = message.from + ' 加入了聊天室';
                    break;
                case 'LEAVE':
                    className += 'leave-message';
                    text = message.from + ' 离开了聊天室';
                    break;
                case 'CHAT':
                    className += 'chat-message';
                    text = '<strong>' + message.from + ':</strong> ' + message.text;
                    if (message.time) {
                        text += ' <small>(' + message.time + ')</small>';
                    }
                    break;
                default:
                    className += 'message';
                    text = message.text;
            }
            
            messageElement.className = className;
            messageElement.innerHTML = text;
            messagesDiv.appendChild(messageElement);
            
            // 自动滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 表单提交事件监听
        document.getElementById('message-form').addEventListener('submit', function(event) {
            event.preventDefault();
            if (connected) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
