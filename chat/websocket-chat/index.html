<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srayons WebSocket 聊天室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 800px;
      height: 80vh;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #4a5568;
      color: white;
      padding: 15px 20px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f7fafc;
    }

    .message {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 18px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }

    .received {
      background: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .sent {
      background: #667eea;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #e2e8f0;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 25px;
      outline: none;
      font-size: 1em;
    }

    #sendButton {
      margin-left: 10px;
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }

    #sendButton:hover {
      background: #5a67d8;
    }

    #sendButton:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #718096;
    }

    .username-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 15px;
    }

    .username-input input {
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 25px;
      outline: none;
      font-size: 1em;
      width: 250px;
      text-align: center;
    }

    .username-input button {
      padding: 12px 25px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Srayons WebSocket 聊天室
    </div>
    <div class="status" id="status">连接状态: 尝试连接...</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." disabled>
      <button id="sendButton" disabled>发送</button>
    </div>
  </div>

  <script>
    class WebSocketChat {
      constructor() {
        this.ws = null;
        this.isConnected = false;
        this.username = '';
        
        this.initializeElements();
        this.setupEventListeners();
        this.showUsernamePrompt();
      }

      initializeElements() {
        this.messagesDiv = document.getElementById('messages');
        this.messageInput = document.getElementById('messageInput');
        this.sendButton = document.getElementById('sendButton');
        this.statusDiv = document.getElementById('status');
      }

      setupEventListeners() {
        this.sendButton.addEventListener('click', () => this.sendMessage());
        this.messageInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.sendMessage();
          }
        });
      }

      showUsernamePrompt() {
        // 创建用户名输入界面
        const container = document.querySelector('.chat-container');
        container.innerHTML = `
          <div class="chat-header">
            Srayons WebSocket 聊天室
          </div>
          <div class="username-input">
            <h3>请输入您的用户名</h3>
            <input type="text" id="usernameInput" placeholder="输入用户名" maxlength="20">
            <button id="joinButton">加入聊天室</button>
          </div> `;

        const usernameInput = document.getElementById('usernameInput');
        const joinButton = document.getElementById('joinButton');

        // 设置焦点到用户名输入框
        usernameInput.focus();

        // 加入按钮事件
        joinButton.addEventListener('click', () => {
          this.setUsername(usernameInput.value.trim());
        });

        // 回车键加入
        usernameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.setUsername(usernameInput.value.trim());
          }
        });
      }

      setUsername(username) {
        if (!username) {
          alert('请输入用户名');
          return;
        }

        this.username = username;
        this.connect();
      }

      connect() {
        // 尝试连接到WebSocket服务器
        try {
          // 在实际部署时，这里需要替换为实际的WebSocket服务器地址
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = protocol + '//' + window.location.host + ':8080';
          
          this.ws = new WebSocket(wsUrl);

          this.ws.onopen = () => {
            this.isConnected = true;
            this.statusDiv.textContent = '连接状态: 已连接';
            this.messageInput.disabled = false;
            this.sendButton.disabled = false;
            
            // 发送用户加入消息
            this.sendMessage('[SYSTEM] \ 加入了聊天室');
          };

          this.ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            this.displayMessage(message.username, message.text, message.timestamp);
          };

          this.ws.onclose = () => {
            this.isConnected = false;
            this.statusDiv.textContent = '连接状态: 已断开';
            this.messageInput.disabled = true;
            this.sendButton.disabled = true;
            
            // 尝试重连
            setTimeout(() => {
              if (!this.isConnected) {
                this.connect();
              }
            }, 3000);
          };

          this.ws.onerror = (error) => {
            console.error('WebSocket 错误:', error);
            this.statusDiv.textContent = '连接状态: 连接错误';
          };
        } catch (error) {
          console.error('连接失败:', error);
          this.statusDiv.textContent = '连接状态: 连接失败';
        }
      }

      sendMessage(text = null) {
        const messageText = text !== null ? text : this.messageInput.value.trim();
        
        if (!messageText) return;
        if (!this.isConnected) {
          alert('未连接到服务器');
          return;
        }

        const message = {
          username: this.username,
          text: messageText,
          timestamp: new Date().toLocaleTimeString()
        };

        try {
          this.ws.send(JSON.stringify(message));
          if (!text) { // 不是系统消息
            this.messageInput.value = '';
          }
        } catch (error) {
          console.error('发送消息失败:', error);
        }
      }

      displayMessage(username, text, timestamp) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message received';
        
        // 区分自己和其他人的消息
        if (username === this.username) {
          messageDiv.classList.remove('received');
          messageDiv.classList.add('sent');
        }
        
        messageDiv.innerHTML = 
          `<div><strong>${username}</strong> <small>${timestamp}</small></div>
          <div>${this.escapeHtml(text)}</div>
        `;
        
        this.messagesDiv.appendChild(messageDiv);
        this.messagesDiv.scrollTop = this.messagesDiv.scrollHeight;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    // 页面加载完成后初始化聊天室
    document.addEventListener('DOMContentLoaded', () => {
      new WebSocketChat();
    });
  </script>
</body>
</html>
