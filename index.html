<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRayons - 作品集主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .hero {
      padding: 60px 40px;
      background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      color: white;
    }

    .hero h1 {
      font-size: 3em;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .hero p {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .nav-button {
      display: inline-block;
      padding: 12px 20px;
      background: rgba(255,255,255,0.1);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 0.9em;
    }

    .nav-button:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .content {
      padding: 40px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .project-card {
      background: #f7fafc;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .project-card h3 {
      color: #4a5568;
      margin-bottom: 10px;
    }

    .project-card p {
      color: #718096;
      font-size: 0.95em;
    }

    .footer {
      background: #4a5568;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>SRayons</h1>
      <p>初级前后端开发兼运维 | 技术爱好者 | 持续学习者</p>
      <div class="nav-buttons">
        <a href="./resume.html" class="nav-button">📄 标准简历</a>
        <a href="./modern-resume.html" class="nav-button">🌟 现代简历</a>
        <a href="./frontend-framework-demo/vue-demo.html" class="nav-button">⚛️ Vue框架演示</a>
        <a href="./chat/" class="nav-button">💬 聊天应用</a>
        <a href="./chat/websocket-chat/" class="nav-button">📡 WebSocket聊天室</a>
      </div>
    </div>

    <div class="content">
      <h2>欢迎来到我的技术作品集</h2>
      <p>这里展示了我的技术项目和专业技能</p>

      <div class="projects">
        <div class="project-card">
          <h3>AI对话助手</h3>
          <p>基于Vue3和Vite构建的智能对话系统，集成多种AI模型</p>
        </div>
        <div class="project-card">
          <h3>WebSocket聊天室</h3>
          <p>实时多人聊天应用，支持高并发连接和消息广播</p>
        </div>
        <div class="project-card">
          <h3>现代Web应用</h3>
          <p>使用最新前端技术栈构建的高性能Web应用程序</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2023 SRayons. 版权所有</p>
    </div>
  </div>
</body>
</html>
